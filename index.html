<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CalmabyEli — Meditación para mujeres</title>
    <meta
      name="description"
      content="Meditaciones guiadas, respiración y descanso para mujeres, de la mano de Eli. Bajá un cambio, soltá la autoexigencia y dormí mejor."
    />
    <meta name="theme-color" content="#09596c" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CalmabyEli" />
    <meta property="og:title" content="CalmabyEli — Meditación para mujeres" />
    <meta
      property="og:description"
      content="Prácticas cortas para bajar un cambio, soltar la autoexigencia y descansar de verdad."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CalmabyEli" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:image" content="/icons/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CalmabyEli: un momento para vos." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icons/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // The night palette from the very first frame: on Dormir, and from 20 h to 5 h while the
      // beach follows the hour. The same rule as ThemeSync (App.tsx) and isNightHour (scenes.ts).
      (function () {
        try {
          var h = new Date().getHours();
          var saved = JSON.parse(localStorage.getItem('mindfulness-by-eli') || 'null');
          var scene = saved && saved.state && saved.state.settings && saved.state.settings.sceneId;
          var followsHour = !scene || scene === 'auto';
          if (location.pathname.indexOf('/dormir') === 0 || (followsHour && (h >= 20 || h < 5))) {
            document.documentElement.setAttribute('data-theme', 'noche');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1a3a');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        background: #09596c;
      }
      /* the night palette; kept as weak as the rules above so the app's own colours still win */
      html:where([data-theme='noche']),
      :where(html[data-theme='noche']) body {
        background: #0e1a3a;
      }
      /* Shown by the HTML itself while the app loads, then faded out by the app. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(70% 50% at 50% 42%, rgba(247, 220, 192, 0.12), rgba(9, 89, 108, 0) 70%), #09596c;
        transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 56px;
        height: 56px;
        animation: splash-breath 5s ease-in-out infinite;
      }
      #splash p {
        margin: 0;
        font: 500 34px/1 'Cormorant Garamond Variable', Georgia, serif;
        letter-spacing: -0.01em;
        color: #f7f1e6;
      }
      #splash i {
        color: #b4fff2;
      }
      :where(html[data-theme='noche']) #splash {
        background: radial-gradient(70% 50% at 50% 42%, rgba(247, 220, 192, 0.1), rgba(14, 26, 58, 0) 70%), #0e1a3a;
      }
      :where(html[data-theme='noche']) #splash i {
        color: #cdd8ff;
      }
      @keyframes splash-breath {
        0%,
        100% {
          transform: scale(0.94);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="24" fill="#a8dcd5" />
        <path d="M22.6 35.5C16 34.8 11.4 30.2 10.6 22.8c6 1.3 10.2 5.5 12 12.7Z" fill="#2e7280" />
        <path d="M25.4 35.5C32 34.8 36.6 30.2 37.4 22.8c-6 1.3-10.2 5.5-12 12.7Z" fill="#2e7280" />
        <path d="M24 11.7c4.6 4.9 6 12.4 0 23.5-6-11.1-4.6-18.6 0-23.5Z" fill="#0f2330" />
      </svg>
      <p>Calma<i>byEli</i></p>
    </div>
    <div id="root"></div>
    <noscript>CalmabyEli necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
