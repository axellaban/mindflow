name: OpenAI voice test
# Separate test: narrates one passage with OpenAI voices and saves the MP3s in
# tools/tts/openai-test on this branch. Needs the OPENAI_API_KEY repository secret.
on:
  push:
    branches: [claude/meditation-app-calm-mvp-6y0ic0]
    paths:
      - '.github/workflows/openai-voice-test.yml'
      - 'tools/tts/openai_test.py'

permissions:
  contents: write

concurrency:
  group: openai-voice-test
  cancel-in-progress: true

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check the OpenAI key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Falta el secret OPENAI_API_KEY; agregalo y volvé a correr este workflow."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Narrate the passage with each voice
        if: steps.key.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pip install --quiet numpy scipy imageio-ffmpeg
          python tools/tts/openai_test.py
      - name: Save the samples on this branch
        if: steps.key.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/tts/openai-test
          git commit -m 'Muestras de voces de OpenAI (prueba aparte)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
