name: Dora audio batches
on:
  push:
    branches: [codex/dora-batches]
    paths:
      - '.github/workflows/dora-batches.yml'
      - 'tools/tts/dora*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dora-audio-batches
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/codex/dora-batches' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dora-batches
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local narration engine
        run: bash tools/tts/dora-setup.sh
      - name: Generate, verify and save each batch before continuing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tools/tts/.venv/bin/python tools/tts/dora-batches.py --publish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete app build
        run: npm ci --no-audit --no-fund && npm run build
